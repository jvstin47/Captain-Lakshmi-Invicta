<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep ink background -->
  <rect width="64" height="64" rx="10" fill="#12100e"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="27" stroke="#c08269" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- 8-spoke grid (cardinal + diagonal) -->
  <line x1="32" y1="9"  x2="32" y2="55" stroke="#c08269" stroke-width="1.2" opacity="0.3"/>
  <line x1="9"  y1="32" x2="55" y2="32" stroke="#c08269" stroke-width="1.2" opacity="0.3"/>
  <line x1="13" y1="13" x2="51" y2="51" stroke="#c08269" stroke-width="1"   opacity="0.18"/>
  <line x1="51" y1="13" x2="13" y2="51" stroke="#c08269" stroke-width="1"   opacity="0.18"/>

  <!-- 8-pointed regiment star -->
  <polygon
    points="32,10 34,28 42,18 34,30 54,29 35,33 47,46 33,35 32,55 30,35 17,46 30,33 10,29 30,30 22,18 30,28"
    fill="#c08269"
    opacity="0.92"
  />

  <!-- Centre ink fill to clean up star middle -->
  <circle cx="32" cy="32" r="9" fill="#1c1917"/>

  <!-- Central "L" monogram -->
  <text
    x="32" y="37"
    font-family="Georgia, serif"
    font-size="13"
    font-weight="700"
    text-anchor="middle"
    fill="#e8c99a"
  >L</text>

  <!-- Inner accent ring -->
  <circle cx="32" cy="32" r="10" stroke="#c08269" stroke-width="0.8" fill="none" opacity="0.5"/>
</svg>
